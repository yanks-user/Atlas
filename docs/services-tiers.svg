<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" font-family="'Segoe UI', 'Segoe UI Variable Text', system-ui, sans-serif">
  <title>TACNET : les services tiers</title>
  <desc>Les joueurs se connectent au serveur TACNET, hébergé sur le plan gratuit de Render, dont le disque est effacé à chaque redémarrage. Upstash, facultatif et gratuit, garde les pseudos et les sessions malgré cet effacement. La voix passe directement entre joueurs. GitHub fournit les versions et le code, et Google aide les PC à se trouver.</desc>
  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b8c4cc"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3ddc84"/></marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b49cff"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#0a0e11"/>
  <text x="40" y="50" font-size="32" font-weight="700" fill="#e2e9ed">TACNET : les services tiers</text>
  <text x="40" y="80" font-size="18" fill="#8a9aa5">Qui fait quoi autour du serveur</text>

  <!-- ===== Joueurs ===== -->
  <rect x="40" y="140" width="250" height="360" rx="14" fill="#0e1418" stroke="#3ddc84" stroke-width="2"/>
  <text x="62" y="180" font-size="24" font-weight="700" fill="#e2e9ed">Joueurs</text>
  <text x="62" y="208" font-size="17" fill="#8a9aa5">Application TACNET</text>
  <rect x="58" y="244" width="90" height="46" rx="8" fill="#131b20" stroke="#3ddc84" stroke-width="1.5"/>
  <text x="103" y="273" font-size="17" fill="#e2e9ed" text-anchor="middle">Joueur</text>
  <rect x="182" y="244" width="90" height="46" rx="8" fill="#131b20" stroke="#3ddc84" stroke-width="1.5"/>
  <text x="227" y="273" font-size="17" fill="#e2e9ed" text-anchor="middle">Joueur</text>
  <rect x="120" y="344" width="90" height="46" rx="8" fill="#131b20" stroke="#3ddc84" stroke-width="1.5"/>
  <text x="165" y="373" font-size="17" fill="#e2e9ed" text-anchor="middle">Gérant</text>
  <line x1="148" y1="267" x2="182" y2="267" stroke="#3ddc84" stroke-width="3.5" stroke-dasharray="8 6"/>
  <line x1="115" y1="290" x2="145" y2="344" stroke="#3ddc84" stroke-width="3.5" stroke-dasharray="8 6"/>
  <line x1="215" y1="290" x2="185" y2="344" stroke="#3ddc84" stroke-width="3.5" stroke-dasharray="8 6"/>
  <text x="165" y="432" font-size="17" font-weight="700" fill="#3ddc84" text-anchor="middle">Voix directe</text>
  <text x="165" y="456" font-size="17" fill="#e2e9ed" text-anchor="middle">entre joueurs :</text>
  <text x="165" y="478" font-size="17" fill="#e2e9ed" text-anchor="middle">jamais par le serveur</text>

  <!-- ===== Render ===== -->
  <rect x="470" y="140" width="300" height="240" rx="14" fill="#0e1418" stroke="#ffb224" stroke-width="2"/>
  <text x="492" y="180" font-size="24" font-weight="700" fill="#ffb224">Render</text>
  <text x="492" y="208" font-size="17" fill="#8a9aa5">Héberge le serveur</text>
  <rect x="490" y="224" width="260" height="80" rx="10" fill="#131b20" stroke="#3ddc84" stroke-width="2"/>
  <text x="620" y="256" font-size="21" font-weight="700" fill="#e2e9ed" text-anchor="middle">Serveur TACNET</text>
  <text x="620" y="282" font-size="16" fill="#8a9aa5" text-anchor="middle">Sessions, canaux, pseudos</text>
  <text x="620" y="334" font-size="17" font-weight="700" fill="#ffb224" text-anchor="middle">Plan gratuit : le disque est</text>
  <text x="620" y="358" font-size="17" font-weight="700" fill="#ffb224" text-anchor="middle">effacé à chaque redémarrage</text>

  <!-- ===== Serveur maison ===== -->
  <rect x="470" y="410" width="300" height="100" rx="14" fill="#0e1418" stroke="#b49cff" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="492" y="450" font-size="22" font-weight="700" fill="#b49cff">Ou serveur maison</text>
  <text x="492" y="480" font-size="17" fill="#8a9aa5">facultatif · disque durable</text>

  <!-- ===== GitHub ===== -->
  <rect x="900" y="140" width="260" height="150" rx="14" fill="#0e1418" stroke="#ffb224" stroke-width="2"/>
  <text x="922" y="180" font-size="24" font-weight="700" fill="#ffb224">GitHub</text>
  <text x="922" y="222" font-size="17" fill="#e2e9ed">Page et versions · public</text>
  <text x="922" y="256" font-size="17" fill="#e2e9ed">Code de Render · public</text>

  <!-- ===== Upstash ===== -->
  <rect x="900" y="375" width="260" height="180" rx="14" fill="#0e1418" stroke="#b49cff" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="922" y="415" font-size="24" font-weight="700" fill="#b49cff">Upstash</text>
  <text x="1138" y="415" font-size="16" fill="#8a9aa5" text-anchor="end">facultatif</text>
  <text x="922" y="445" font-size="17" font-weight="700" fill="#b49cff">Plan gratuit</text>
  <text x="922" y="480" font-size="16" fill="#e2e9ed">Garde les pseudos et les</text>
  <text x="922" y="502" font-size="16" fill="#e2e9ed">sessions quand le disque</text>
  <text x="922" y="524" font-size="16" fill="#e2e9ed">de Render est effacé</text>

  <!-- ===== Google ===== -->
  <rect x="900" y="600" width="260" height="90" rx="14" fill="#0e1418" stroke="#ffb224" stroke-width="2"/>
  <text x="922" y="638" font-size="22" font-weight="700" fill="#ffb224">STUN de Google</text>
  <text x="922" y="664" font-size="16" fill="#8a9aa5">Aide les PC à se trouver</text>

  <!-- ===== Flèches ===== -->
  <line x1="292" y1="264" x2="468" y2="264" stroke="#3ddc84" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="380" y="244" font-size="16" fill="#e2e9ed" text-anchor="middle">Connexion chiffrée</text>

  <path d="M165 140 L165 116 L1030 116 L1030 138" fill="none" stroke="#b8c4cc" stroke-width="3" marker-end="url(#aGray)"/>
  <text x="600" y="106" font-size="17" fill="#e2e9ed" text-anchor="middle">Recherche de mises à jour</text>

  <line x1="898" y1="256" x2="772" y2="256" stroke="#b8c4cc" stroke-width="3" marker-end="url(#aGray)"/>
  <text x="835" y="218" font-size="16" fill="#e2e9ed" text-anchor="middle">Render lit</text>
  <text x="835" y="238" font-size="16" fill="#e2e9ed" text-anchor="middle">ce code</text>

  <path d="M772 345 L836 345 L836 472 L898 472" fill="none" stroke="#b49cff" stroke-width="3" stroke-dasharray="9 7" marker-start="url(#aViolet)" marker-end="url(#aViolet)"/>

  <path d="M165 500 L165 645 L898 645" fill="none" stroke="#b8c4cc" stroke-width="3" marker-end="url(#aGray)"/>
  <text x="530" y="633" font-size="17" fill="#e2e9ed" text-anchor="middle">Trouver les autres PC</text>

  <!-- ===== Légende ===== -->
  <line x1="40" y1="715" x2="1160" y2="715" stroke="#1d2830" stroke-width="1"/>
  <rect x="40" y="729" width="26" height="15" rx="3" fill="#0e1418" stroke="#3ddc84" stroke-width="2"/>
  <text x="76" y="742" font-size="16" fill="#8a9aa5">TACNET</text>
  <rect x="190" y="729" width="26" height="15" rx="3" fill="#0e1418" stroke="#ffb224" stroke-width="2"/>
  <text x="226" y="742" font-size="16" fill="#8a9aa5">Service tiers utilisé par défaut</text>
  <rect x="480" y="729" width="26" height="15" rx="3" fill="#0e1418" stroke="#b49cff" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="516" y="742" font-size="16" fill="#8a9aa5">Facultatif</text>
  <line x1="650" y1="737" x2="694" y2="737" stroke="#3ddc84" stroke-width="3.5" stroke-dasharray="8 6"/>
  <text x="706" y="742" font-size="16" fill="#8a9aa5">Voix directe entre joueurs</text>
</svg>
